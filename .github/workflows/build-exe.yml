name: Build CuePilot.exe

on:
  workflow_dispatch:        # lets you click "Run workflow" on the Actions tab
  push:
    tags: ["v*"]            # also runs when you publish a release tagged v1.0, v1.1 ...

permissions:
  contents: write           # needed to attach the exe to a release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build the exe
        run: pyinstaller --noconfirm --onefile --windowed --name CuePilot --icon cuepilot.ico cuepilot.py

      - name: Save the exe as a download
        uses: actions/upload-artifact@v4
        with:
          name: CuePilot-exe
          path: dist/CuePilot.exe

      - name: Attach the exe to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CuePilot.exe
