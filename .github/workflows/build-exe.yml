name: Build CuePilot.exe

on:
  workflow_dispatch:        # lets you click "Run workflow" on the Actions tab
  push:
    tags: ["v*"]            # also runs when you publish a release tagged v1.0, v1.1 ...

permissions:
  contents: write           # needed to attach the exe to a release

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Self-test the app (Python source)
        timeout-minutes: 8
        shell: pwsh
        run: |
          python cuepilot.py --selftest --report selftest-source.txt
          $code = $LASTEXITCODE
          # The report is the source of truth; the process exit code is only shown for diagnosis.
          if (-not (Test-Path selftest-source.txt)) { Write-Host "No report was written (exit code $code)."; exit 1 }
          $summary = Get-Content selftest-source.txt | Where-Object { $_ -match 'passed, .* failed' } | Select-Object -Last 1
          Write-Host "Summary: $summary (process exit code $code)"
          if ($summary -match '(\d+) passed, .* (\d+) failed' -and [int]$Matches[1] -gt 0 -and [int]$Matches[2] -eq 0) { exit 0 }
          Write-Host "Self-test reported failures. Download selftest-reports to see them."
          exit 1

      - name: Build the exe
        run: pyinstaller --noconfirm --onefile --windowed --name CuePilot --icon cuepilot.ico --collect-data soundcard --collect-data docx cuepilot.py

      - name: Self-test the finished exe
        timeout-minutes: 8
        shell: pwsh
        run: |
          $report = Join-Path $PWD "selftest-exe.txt"
          $p = Start-Process -FilePath "dist\CuePilot.exe" -ArgumentList "--selftest","--report","`"$report`"" -Wait -PassThru
          $code = $p.ExitCode
          if (-not (Test-Path $report)) { Write-Host "The exe did not write a report (exit code $code)."; exit 1 }
          Get-Content $report
          $summary = Get-Content $report | Where-Object { $_ -match 'passed, .* failed' } | Select-Object -Last 1
          Write-Host "Summary: $summary (process exit code $code)"
          if ($summary -match '(\d+) passed, .* (\d+) failed' -and [int]$Matches[1] -gt 0 -and [int]$Matches[2] -eq 0) { exit 0 }
          Write-Host "The exe self-test reported failures. Download selftest-reports to see them."
          exit 1

      - name: Save the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-reports
          path: selftest-*.txt
          if-no-files-found: warn

      - name: Save the exe as a download
        uses: actions/upload-artifact@v4
        with:
          name: CuePilot-exe
          path: dist/CuePilot.exe

      - name: Attach the exe to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CuePilot.exe
